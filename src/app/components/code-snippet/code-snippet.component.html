<article class="w-full overflow-hidden bg-neutral-950" aria-label="Code snippet card">
  <header class="flex items-center justify-between gap-2 bg-neutral-900 px-3 py-2">
    <span class="text-sm text-neutral-400">{{ getCurrentFileName() }}</span>
    
    <div *ngIf="hasMultipleLanguages" class="flex gap-2">
      <button
        *ngFor="let snippet of snippets; let i = index"
        (click)="selectLanguage(i)"
        [class.active]="selectedLanguageIndex === i"
        class="px-2 py-1 text-xs rounded transition-colors"
        [class]="selectedLanguageIndex === i 
          ? 'bg-blue-600 text-white' 
          : 'bg-neutral-800 text-neutral-300 hover:bg-neutral-700'">
        {{ snippet.language }}
      </button>
    </div>
  </header>

  <pre class="m-0 overflow-x-auto p-4 text-sm text-neutral-100 font-['courier-prime',monospace]"><code [innerHTML]="highlightedCode"></code></pre>
</article>
